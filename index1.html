<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 1. Print Numbers
        // Print numbers from 1 to 20 using a for loop.

        // ANS:-
        for (let n = 1; n <= 20; n++) {
            let count = 0;
            for (let i = 1; i <= n; i++) {
                if (n % i == 0) {
                    count++;
                }
            }
            if (count == 2) {
                console.log(n);
            }
        }

        // 2. Odd Numbers
        // Print all odd numbers from 1 to 50.
        
        // ANS:-
            for(i = 1; i<=50; i++){
                if(i % 2 != 0){
                    console.log(i);
                    
                }
            }

        // 3. Multiplication Table
        // Print the multiplication table of 7.
        // Example:
        // 7 x 1 = 7
        // 7 x 2 = 14

        // ANS:-
            let n = 7;
            for(let i = 1; i<=10;i++){
                console.log("7 x " + i + " = " + (n * i));
            }

        // 4. Reverse Counting
        // Using while loop, print numbers from 20 to 1.

        // ANS:-
            let a = 20;
            while (a >= 1) {
                console.log(a);
                a--;
            }

        // 5. Sum of Numbers
        // Find the total sum of numbers from 1 to 100.

        // ANS:-
            let sum = 0;
            for(let i = 1; i <= 100; i++){
                sum += i;
            }
            console.log(sum);
            

        // 6. Array Loop
        // Loop through this array and print all values.
        // let fruits = ["apple", "banana", "orange", "grapes"]

        // ANS:-
            let fruits = ["apple", "banana","orange","grapes"]
            for(let i = 0; i < fruits.length; i++){
                console.log(fruits[i]);
            }

        // 7. Count Even Numbers
        // Count how many even numbers are present between 1 to 50.

        // ANS:-
            let count=0;
            for(let i=1;i<=50;i++){
                if(i % 2 == 0){
                    count++
                }
            }
            console.log(count);

        // 8. Star Pattern
        // Print this pattern using loops:
        // *
        // **
        // ***
        // ****
        // *****

        // ANS:-
            for(let i = 1;i <= 5;i++){
                let s = "";
                for(let j = 1;j <= i; j++){
                    s +="* ";
                }
                console.log(s);
                
            }

        // Functions
        // 9. Simple Function
        // Create a function named welcome() that prints:
        // Welcome to JavaScript

        // ANS:-
            function welcome(){
                console.log("wellcome to Javascript");
            }
            welcome();

        // 10. Function with Parameter
        // Create a function that accepts a name and prints:
        // Hello Naveen

        // ANS:-
            function green(name) {
                console.log("Hello " + name);
            }
            green("Naveen")

        // 11. Add Two Numbers
        // Create a function that takes 2 numbers and returns the addition.
        // add(10, 20)
        // Example:
        // Output:
        // 30

        // ANS:-
            function add(a , b){
                return a + b;
            }
            console.log(add(10,20));
            

        // 12. Salary Bonus
        // Create a function that adds bonus to employee salary.
        // Example:
        // salary = 50000
        // bonus = 5000
        // Output:
        // 55000

        // ANS:-
            function totalsalary(salary, bonus) {
                return salary + bonus;
            }
            console.log(totalsalary(50000,5000));
            

        // 13. Object Loop
        // Print all keys and values using for in.
        // let student = {
        // name: "Rahul",
        // course: "JavaScript",
        // marks: 95
        // }

        // ANS:-
            let student = {
                name: "Rahul",
                course:"Javascript",
                marks:95
            };
            for(let key in student){
                console.log(key + " : " + student[key]);
                
            }

        // 14. Find Largest Number
        // Create a function to find the largest number between two values.
        // Example:
        // largest(10, 50)
        // Output:
        // 50

        // ANS:-
            function largest(a , b) {
                if(a > b){
                    console.log(a);
                }else{
                    console.log(b);
                    
                }
            }
            largest(10 , 50)

        // 15. Mini Employee Task
        // Create an employee object and print:
        // Employee Name
        // Department
        // Salary
        // Salary after bonus
        // Using:
        // object
        // function
        // parameter
        // console.log()

        // ANS:-
            let employee = {
                name:"sai",
                Department:"Fullstack Devloper",
                salary:50000
            };
            function bonus(salary, extra) {
                return salary + extra;
            }
            console.log("Employee Name: " + employee.name);
            console.log("Department: " + employee.Department);
            console.log("Salary: " + employee.salary);
            console.log("salary after bonus: " + bonus(employee.salary , 5000));
            
            
            
            

    </script>
</body>

</html>
