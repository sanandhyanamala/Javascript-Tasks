<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // Task 1 – Predict the Output
        // Write the output and datatype for below:
        console.log("10" + 5)
        console.log(10 + true)
        console.log(false + null)
        console.log("Hello" + undefined)
        console.log([1, 2] + 5)

        //  ANS:- 105
        //        11
        //        0
        //        Helloundefined
        //        1,25

        // Task 2 – Implicit Type Casting
        // Create examples for:
        // String + Number
        // Boolean + Number
        // Array + String
        // Object + Number
        // Null + Number
        // Print datatype using typeof.

        // ANS:- 
        // String + Number
        let a = "55" + 9;
        console.log(typeof (a)); // string

        //   Boolean + Number
        let b = true + 2;
        console.log(typeof (b)); //number

        //   Array + String
        let c = [1, 4, 3] + "Hiii";
        console.log(typeof (c)); //String

        //   Object + Number
        let d = {} + 66;
        console.log(typeof (d)); //string

        //   Null + Number
        let e = null + 75;
        console.log(typeof (e)) // number

        // Task 3 – Explicit Type Casting
        // Convert the following into Number:
        // "500"
        // true
        // false
        // null
        // "abc"
        // [100]
        // Print the outputs.

        // ANS:- 
        console.log(Number("500"));
        console.log(Number(true));
        console.log(Number(false));
        console.log(Number(null));
        console.log(Number("abc"));
        console.log(Number([100]));

        // Task 4 – Boolean Constructor
        // Check whether below values are true or false using Boolean().
        // ""
        // "javascript"
        // 0
        // 1
        // null
        // undefined
        // []
        // {}

        ANS: -
        console.log(Boolean(""));  // false
        console.log(Boolean("javascript"));  //true
        console.log(Boolean(0));  //flase
        console.log(Boolean(1));  //true
        console.log(Boolean(null));  //false
        console.log(Boolean(undefined));  //false
        console.log(Boolean([]));  //true
        console.log(Boolean({}));// true

        // Task 5 – Student Pass or Fail
        // Take one variable:
        // let mark = 45
        // Condition:
        // Above 35 → Pass
        // Below 35 → Fail
        // Use if else.

        // ANS:- 
        let mark = 45;
        if (mark > 35) {
            console.log("pass");
        } else {
            console.log("fail");
        }

        // Task 6 – Voting Eligibility
        // Create a variable:
        // let age = 20
        // Conditions:
        // 18 and above → Eligible
        // Otherwise → Not Eligible

        // ANS:-
        let age = 20;
        if (age >= 18) {
            console.log("Eligible");
        }
        else {
            console.log("Not eligible");
        }

        // Task 7 – Greatest Number
        // Find greatest among 3 numbers using if else if.
        // Example:
        // let a = 50
        // let b = 80
        // let c = 30

        // ANS:-
        let num1 = 50;
        let num2 = 80;
        let num3 = 30;

        // ANS:-
        if (num1 > num2 && num1 > num3) {
            console.log("num1 is greatest number");
        } else if (num2 > num1 && num2 > num3) {
            console.log("num2 is greatest number");
        }
        else {
            console.log("num3 is greatest number");
        }

        // Task 8 – Traffic Light System
        // Using switch statement:
        // red → stop
        // yellow → ready
        // green → go

        // ANS:-
        let color = "red";
        switch (color) {

            case "red":
                console.log("stop");
                break;

            case "yellow":
                console.log("reday");
                break;

            case "green":
                console.log("go");
                break;

            default:
                console.log("Drive safe");
        }


        // Task 9 – Login System
        // Create variables:
        // let username = "admin"
        // let password = "1234"
        // Conditions:
        // Both correct → Login Success
        // Otherwise → Invalid Login
        // Use nested if.

        // ANS:-
        let username = "admin";
        let password = "1234";
        if (username === "admin") {
            if (password === "1234") {
                console.log("Login Successfully");
            } else {
                console.log("Invalid password");
            }
        } else {
            console.log("Invalid username");
        }

        // Task 10 – Session Finder
        // Take hour value:
        // let hour = 14;
        // Conditions:
        // 1–12 → Morning
        // 13–15 → Afternoon
        // 16–19 → Evening
        // 20–24 → Night
        // Use else if.

        // ANS:-
        let hour = 14;
        if (hour <= 12) {
            console.log("Morning");
        } else if (hour <= 15) {
            console.log("Afternoon");
        } else if (hour <= 19) {
            console.log("Evening");
        } else if (hour <= 24) {
            console.log("Night");
        } else {
            console.log("Invalid input");
        }

        // Bonus Challenge 🔥
        // Predict outputs without running:
        console.log(true + true)
        console.log("5" - 2)
        console.log("5" + 2)
        console.log(null + 1)
        console.log(undefined + 1)
        console.log(Boolean(" "))
        console.log(Number(true))

        // ANS:-
        // 2
        // 3
        // 52
        // 1
        // NaN
        // true
        // 1
    </script>
</body>

</html>
